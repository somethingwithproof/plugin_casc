name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  entry-point-lint:
    name: PHP 8.0 entry point lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.0'
          coverage: none

      - name: Lint PHP 8.0 entry points
        run: |
          set -euo pipefail
          php -v
          for f in *.php include/*.php cli/*.php scripts/*.php; do
            php -l "$f"
          done

  unit-and-static-analysis:
    name: PHP ${{ matrix.php }} unit tests and PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Cacti 1.2.31 for symbol scanning
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: Cacti/cacti
          ref: release/1.2.31
          path: cacti

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, json, libxml, pdo, pdo_mysql
          coverage: ${{ matrix.php == '8.4' && 'pcov' || 'none' }}

      - name: Lint all PHP files
        run: |
          set -euo pipefail
          find lib tests cli include scripts -name '*.php' -print0 | xargs -0 -n1 php -l
          for f in *.php; do php -l "$f"; done

      - name: Install dev tools (zero runtime dependencies)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run unit, security, and quality tests with coverage
        if: matrix.php == '8.4'
        run: |
          set -euo pipefail
          mkdir -p coverage
          vendor/bin/phpunit -c phpunit.xml --coverage-clover=coverage/clover.xml

      - name: Enforce minimum 85% line coverage
        if: matrix.php == '8.4'
        run: |
          php -r '
            $xml = simplexml_load_file("coverage/clover.xml");
            if ($xml === false || !isset($xml->project->metrics)) {
              fwrite(STDERR, "Failed to parse coverage/clover.xml\n");
              exit(1);
            }
            $m = $xml->project->metrics;
            $total = (int) $m["statements"];
            $covered = (int) $m["coveredstatements"];
            $pct = $total > 0 ? ($covered / $total) * 100.0 : 0.0;
            printf("Measured line coverage: %.2f%% (%d / %d statements)\n", $pct, $covered, $total);
            if ($pct < 85.0) {
              fwrite(STDERR, "ERROR: Line coverage below required 85.00% threshold\n");
              exit(1);
            }
          '

      - name: Upload coverage report artifact
        if: matrix.php == '8.4'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clover-coverage-php84
          path: coverage/clover.xml
          if-no-files-found: error

      - name: SonarCloud Scan
        if: ${{ matrix.php == '8.4' && env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Run unit, security, and quality tests
        if: matrix.php != '8.4'
        run: vendor/bin/phpunit -c phpunit.xml

      - name: Run PHPStan Level 9
        env:
          CACTI_PATH: ${{ github.workspace }}/cacti
        run: vendor/bin/phpstan analyse -c phpstan.neon --memory-limit=1G --no-progress

  cacti-integration:
    name: Integration PHP ${{ matrix.php }} on Cacti ${{ matrix.cacti }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
        cacti: ['release/1.2.31', '1.2.x']

    services:
      mariadb:
        image: mariadb:11.8@sha256:6422478cb8e159f080fb1d8ccf65101e26fe51385787fde7d16c3b165a331f15
        env:
          MYSQL_ROOT_PASSWORD: cactiroot
          MYSQL_DATABASE: cacti
          MYSQL_USER: cactiuser
          MYSQL_PASSWORD: cactiuser
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout Cacti
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: Cacti/cacti
          ref: ${{ matrix.cacti }}
          path: cacti

      - name: Checkout plugin_casc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: cacti/plugins/casc

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mysql, gd, ldap, gmp, xml, curl, json, mbstring, snmp
          ini-values: "post_max_size=256M, max_execution_time=60, date.timezone=UTC"
          coverage: none

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y rrdtool gettext mariadb-client

      - name: Initialize Cacti MariaDB schema
        run: |
          printf "[client]\nuser = root\npassword = cactiroot\nhost = 127.0.0.1\n" > ~/.my.cnf
          chmod 600 ~/.my.cnf
          mariadb -e "CREATE USER IF NOT EXISTS 'cactiuser'@'127.0.0.1' IDENTIFIED BY 'cactiuser';"
          mariadb -e "GRANT ALL PRIVILEGES ON cacti.* TO 'cactiuser'@'127.0.0.1';"
          mariadb -e "GRANT SELECT ON mysql.time_zone_name TO 'cactiuser'@'127.0.0.1';"
          mariadb -e "FLUSH PRIVILEGES;"
          mariadb cacti < cacti/cacti.sql
          mariadb -e "INSERT INTO settings (name, value) VALUES ('path_php_binary', '$(command -v php)')" cacti

      - name: Configure and install Cacti
        run: |
          sed -r "s/localhost/127.0.0.1/g" cacti/include/config.php.dist > cacti/include/config.php
          cd cacti
          php cli/install_cacti.php --accept-eula --install --force
          php cli/plugin_manage.php --plugin=casc --install --enable

      - name: Install dev tools for integration test runner
        working-directory: cacti/plugins/casc
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run MariaDB integration tests
        working-directory: cacti/plugins/casc
        env:
          CACTI_PATH: ${{ github.workspace }}/cacti
        run: vendor/bin/phpunit -c phpunit-integration.xml

      - name: Smoke-test CLI export, validate, drift, plan, and apply
        working-directory: cacti
        run: |
          set -euo pipefail
          php plugins/casc/cli/casc.php export --format=yaml --output=/tmp/cacti-export-redacted.yaml
          php plugins/casc/cli/casc.php validate --file=/tmp/cacti-export-redacted.yaml
          php plugins/casc/cli/casc.php export --format=yaml --omit-secrets --output=/tmp/cacti-export.yaml
          php plugins/casc/cli/casc.php validate --file=/tmp/cacti-export.yaml
          php plugins/casc/cli/casc.php drift --file=/tmp/cacti-export.yaml --format=nagios
          php plugins/casc/cli/casc.php export --format=xml --omit-secrets --output=/tmp/cacti-export.xml
          php plugins/casc/cli/casc.php validate --file=/tmp/cacti-export.xml
          php plugins/casc/cli/casc.php drift --file=/tmp/cacti-export.xml --format=json
          stats_out="$(php plugins/casc/scripts/ss_casc_stats.php)"
          echo "ss_casc_stats: $stats_out"
          php -r '
            $out = trim($argv[1]);
            $re = "/^providers_registered:(\d+|U) drift_items:(\d+|U) last_plan_actions:(\d+|U) last_apply_ms:(\d+|U) validation_errors:(\d+|U) secret_dirs_configured:(\d+|U)$/";
            if (preg_match($re, $out) !== 1) {
              fwrite(STDERR, "Unexpected ss_casc_stats output: $out\n");
              exit(1);
            }
          ' "$stats_out"
